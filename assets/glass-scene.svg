<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<!-- Abstract reading room behind the glass layer (assets/glass.css). Kept mid-light on
     purpose: glass panels at 60% white over its darkest blurred area must still hold
     AA for muted text. Spines use the source identity colours, lightened. -->
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3ece1"/><stop offset=".7" stop-color="#e9dfcf"/><stop offset="1" stop-color="#e2d5c1"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dfe8ef"/><stop offset="1" stop-color="#f6f1e6"/>
  </linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c49b70"/><stop offset="1" stop-color="#a97f58"/>
  </linearGradient>
  <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#ffe7b0" stop-opacity=".95"/><stop offset=".45" stop-color="#f3cf86" stop-opacity=".45"/><stop offset="1" stop-color="#f3cf86" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sun" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fffaf0" stop-opacity=".9"/><stop offset="1" stop-color="#fffaf0" stop-opacity="0"/>
  </radialGradient>
  <filter id="dof" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<g filter="url(#dof)">
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <!-- window, right -->
  <rect x="1010" y="70" width="470" height="700" rx="10" fill="#d9ccb7"/>
  <rect x="1030" y="90" width="430" height="660" fill="url(#sky)"/>
  <rect x="1238" y="90" width="14" height="660" fill="#d9ccb7"/>
  <rect x="1030" y="400" width="430" height="12" fill="#d9ccb7"/>
  <ellipse cx="1250" cy="300" rx="320" ry="260" fill="url(#sun)"/>
  <!-- bookshelf, left -->
  <rect x="60" y="40" width="560" height="780" fill="#c8a57c"/>
  <rect x="80" y="60" width="520" height="740" fill="#b8936a"/>
  <g>
    <rect x="80" y="230" width="520" height="16" fill="#c8a57c"/>
    <rect x="80" y="430" width="520" height="16" fill="#c8a57c"/>
    <rect x="80" y="630" width="520" height="16" fill="#c8a57c"/>
  </g>
  <!-- spines: rfo navy, dfars forest, fc aubergine, dafi oxblood, ssp brass, cm slate -->
  <g>
    <rect x="96"  y="96"  width="34" height="134" fill="#6d84a3"/><rect x="132" y="110" width="28" height="120" fill="#7f9b86"/>
    <rect x="162" y="90"  width="40" height="140" fill="#d2b37a"/><rect x="204" y="118" width="26" height="112" fill="#a8838f"/>
    <rect x="232" y="100" width="36" height="130" fill="#6d84a3"/><rect x="270" y="124" width="30" height="106" fill="#e8dcc6"/>
    <rect x="352" y="104" width="38" height="126" fill="#a7787f"/><rect x="392" y="96"  width="30" height="134" fill="#8a96a1"/>
    <rect x="424" y="120" width="34" height="110" fill="#d2b37a"/><rect x="460" y="102" width="40" height="128" fill="#7f9b86"/>
    <rect x="96"  y="300" width="42" height="130" fill="#d2b37a"/><rect x="140" y="316" width="30" height="114" fill="#6d84a3"/>
    <rect x="172" y="296" width="34" height="134" fill="#e8dcc6"/><rect x="208" y="320" width="28" height="110" fill="#a7787f"/>
    <rect x="300" y="306" width="36" height="124" fill="#8a96a1"/><rect x="338" y="296" width="44" height="134" fill="#6d84a3"/>
    <rect x="384" y="322" width="30" height="108" fill="#7f9b86"/><rect x="480" y="300" width="38" height="130" fill="#a8838f"/>
    <rect x="520" y="314" width="32" height="116" fill="#d2b37a"/>
    <rect x="96"  y="508" width="30" height="122" fill="#7f9b86"/><rect x="128" y="498" width="38" height="132" fill="#a7787f"/>
    <rect x="168" y="520" width="34" height="110" fill="#6d84a3"/><rect x="250" y="502" width="42" height="128" fill="#d2b37a"/>
    <rect x="294" y="516" width="28" height="114" fill="#8a96a1"/><rect x="324" y="498" width="36" height="132" fill="#e8dcc6"/>
    <rect x="430" y="510" width="40" height="120" fill="#6d84a3"/><rect x="472" y="500" width="30" height="130" fill="#a8838f"/>
    <rect x="504" y="522" width="36" height="108" fill="#7f9b86"/>
  </g>
  <!-- floor + rug -->
  <rect x="0" y="820" width="1600" height="180" fill="url(#floor)"/>
  <ellipse cx="820" cy="930" rx="520" ry="70" fill="#8f6b8a" opacity=".35"/>
  <!-- armchair, navy -->
  <rect x="690" y="600" width="300" height="230" rx="60" fill="#55698a"/>
  <rect x="660" y="680" width="80" height="160" rx="36" fill="#4c5f7e"/>
  <rect x="940" y="680" width="80" height="160" rx="36" fill="#4c5f7e"/>
  <!-- floor lamp + glow -->
  <rect x="1550" y="300" width="8" height="530" fill="#8a6a3a"/>
  <circle cx="1554" cy="290" r="230" fill="url(#lamp)"/>
  <!-- plant -->
  <rect x="1300" y="740" width="90" height="90" rx="12" fill="#b9a586"/>
  <ellipse cx="1320" cy="690" rx="46" ry="80" fill="#8fa889" transform="rotate(-18 1320 690)"/>
  <ellipse cx="1370" cy="680" rx="42" ry="88" fill="#a3b89b" transform="rotate(16 1370 680)"/>
  <ellipse cx="1345" cy="650" rx="34" ry="90" fill="#7e9a79"/>
</g>
</svg>
