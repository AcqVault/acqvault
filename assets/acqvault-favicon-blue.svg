<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>AcqVault</title>
  <!-- safe body -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="6.5" fill="#0066CC"/>
  <!-- hinge bar -->
  <rect x="25.4" y="11" width="3" height="10" rx="1.2" fill="#0a3f7a"/>
  <!-- dial face -->
  <circle cx="14.8" cy="16" r="8.6" fill="#0a3f7a"/>
  <circle cx="14.8" cy="16" r="8.6" fill="none" stroke="#ffffff" stroke-width="1.3" opacity="0.85"/>
  <!-- dial spokes -->
  <g stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" opacity="0.9">
    <line x1="14.8" y1="8.6" x2="14.8" y2="11.6"/>
    <line x1="14.8" y1="20.4" x2="14.8" y2="23.4"/>
    <line x1="7.4" y1="16" x2="10.4" y2="16"/>
    <line x1="19.2" y1="16" x2="22.2" y2="16"/>
  </g>
  <!-- glowing hub -->
  <circle cx="14.8" cy="16" r="3.4" fill="#7dd3fc"/>
  <circle cx="14.8" cy="16" r="1.7" fill="#ffffff"/>
</svg>
