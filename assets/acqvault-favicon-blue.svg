<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>AcqVault</title>
  <defs>
    <radialGradient id="fb-body" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#3a3f4a"/>
      <stop offset="100%" stop-color="#1a1d24"/>
    </radialGradient>
    <radialGradient id="fb-hub" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#7dd3fc"/>
      <stop offset="65%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#155FBF"/>
    </radialGradient>
    <radialGradient id="fb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FB6E8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#155FBF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- hinge -->
  <rect x="25.6" y="12" width="3" height="8" rx="1.2" fill="#2c3038"/>
  <!-- safe body -->
  <rect x="2.5" y="2.5" width="27" height="27" rx="7" fill="url(#fb-body)" stroke="#565b64" stroke-width="1"/>
  <!-- dial face -->
  <circle cx="15.3" cy="16" r="9" fill="#252830" stroke="#5a5f68" stroke-width="1"/>
  <!-- spokes -->
  <g stroke="#808691" stroke-width="2" stroke-linecap="round">
    <line x1="15.3" y1="8.6" x2="15.3" y2="11.5"/>
    <line x1="15.3" y1="20.5" x2="15.3" y2="23.4"/>
    <line x1="7.9" y1="16" x2="10.8" y2="16"/>
    <line x1="19.8" y1="16" x2="22.7" y2="16"/>
  </g>
  <!-- glowing cyan hub -->
  <circle cx="15.3" cy="16" r="6" fill="url(#fb-glow)"/>
  <circle cx="15.3" cy="16" r="3.7" fill="url(#fb-hub)"/>
  <circle cx="14.5" cy="15.2" r="1.1" fill="#ffffff" opacity="0.9"/>
</svg>
