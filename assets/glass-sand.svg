<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<!-- AcqVault backdrop: a warm, sunlit room seen out of focus, with no objects. Greige walls,
     window light upper right, sage where plants would be, warm wood low down, grain against banding. -->
<defs>
<linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e7dccb"/><stop offset=".55" stop-color="#d9cbb5"/><stop offset="1" stop-color="#c9b597"/>
</linearGradient>
<radialGradient id="window"><stop offset="0" stop-color="#fbf6ec" stop-opacity=".95"/><stop offset=".45" stop-color="#f4ecdd" stop-opacity=".55"/><stop offset="1" stop-color="#f4ecdd" stop-opacity="0"/></radialGradient>
<radialGradient id="sage"><stop offset="0" stop-color="#9ea47e" stop-opacity=".5"/><stop offset="1" stop-color="#9ea47e" stop-opacity="0"/></radialGradient>
<radialGradient id="sage2"><stop offset="0" stop-color="#8f9a72" stop-opacity=".38"/><stop offset="1" stop-color="#8f9a72" stop-opacity="0"/></radialGradient>
<radialGradient id="wood"><stop offset="0" stop-color="#b48a60" stop-opacity=".5"/><stop offset="1" stop-color="#b48a60" stop-opacity="0"/></radialGradient>
<radialGradient id="shade"><stop offset="0" stop-color="#a99a84" stop-opacity=".42"/><stop offset="1" stop-color="#a99a84" stop-opacity="0"/></radialGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#f3d9a4" stop-opacity=".45"/><stop offset="1" stop-color="#f3d9a4" stop-opacity="0"/></radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix values="0 0 0 0 .2  0 0 0 0 .16  0 0 0 0 .1  0 0 0 .06 0"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#base)"/>
<ellipse cx="140" cy="380" rx="420" ry="520" fill="url(#shade)"/>
<ellipse cx="1360" cy="220" rx="560" ry="460" fill="url(#window)"/>
<ellipse cx="760" cy="300" rx="420" ry="260" fill="url(#glow)"/>
<ellipse cx="110" cy="560" rx="260" ry="360" fill="url(#sage)"/>
<ellipse cx="1290" cy="640" rx="230" ry="300" fill="url(#sage2)"/>
<ellipse cx="780" cy="960" rx="900" ry="260" fill="url(#wood)"/>
<rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
