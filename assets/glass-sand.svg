<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
<!-- AcqVault backdrop: a bright room seen through frosted glass, no photo. Shapes are soft
     but distinct (tall window light, plant greens, a round wall light, a pale sofa line) so the
     glass above them reads as clear glass, not a tinted wash. -->
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#eeebe5"/><stop offset=".62" stop-color="#e4dfd6"/><stop offset="1" stop-color="#d3c8b8"/>
</linearGradient>
<linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f4ee"/>
</linearGradient>
<radialGradient id="lamp"><stop offset="0" stop-color="#fff6e4" stop-opacity=".95"/><stop offset=".6" stop-color="#f2e2c0" stop-opacity=".45"/><stop offset="1" stop-color="#f2e2c0" stop-opacity="0"/></radialGradient>
<radialGradient id="leaf"><stop offset="0" stop-color="#8e9f74" stop-opacity=".75"/><stop offset="1" stop-color="#8e9f74" stop-opacity="0"/></radialGradient>
<radialGradient id="leaf2"><stop offset="0" stop-color="#7d9168" stop-opacity=".6"/><stop offset="1" stop-color="#7d9168" stop-opacity="0"/></radialGradient>
<radialGradient id="floor"><stop offset="0" stop-color="#bfa27c" stop-opacity=".55"/><stop offset="1" stop-color="#bfa27c" stop-opacity="0"/></radialGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/>
<feColorMatrix values="0 0 0 0 .2  0 0 0 0 .18  0 0 0 0 .14  0 0 0 .05 0"/>
</filter>
</defs>
<rect width="1600" height="1000" fill="url(#wall)"/>
<g filter="url(#soft)">
  <!-- tall window, right: bright panes with mullions -->
  <rect x="1150" y="40" width="360" height="680" rx="6" fill="#d9d2c6"/>
  <rect x="1168" y="58" width="154" height="644" fill="url(#win)"/>
  <rect x="1338" y="58" width="154" height="644" fill="url(#win)"/>
  <rect x="1168" y="372" width="324" height="10" fill="#d9d2c6"/>
  <!-- curtain -->
  <rect x="1520" y="20" width="80" height="760" fill="#e8e1d5"/>
  <!-- round wall light, centre -->
  <circle cx="760" cy="300" r="150" fill="url(#lamp)"/>
  <circle cx="760" cy="300" r="70" fill="#f4e7cb" opacity=".8"/>
  <!-- plants: left and by the window -->
  <ellipse cx="110" cy="460" rx="150" ry="300" fill="url(#leaf)"/>
  <ellipse cx="200" cy="560" rx="110" ry="220" fill="url(#leaf2)"/>
  <ellipse cx="1080" cy="560" rx="120" ry="230" fill="url(#leaf)"/>
  <!-- pale sofa and wood low down -->
  <rect x="380" y="690" width="840" height="190" rx="70" fill="#efebe3"/>
  <rect x="420" y="650" width="760" height="90" rx="40" fill="#e9e3d8"/>
  <ellipse cx="800" cy="980" rx="900" ry="170" fill="url(#floor)"/>
</g>
<rect width="1600" height="1000" filter="url(#grain)"/>
</svg>
