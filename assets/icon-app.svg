<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img">
  <title>AcqVault</title>
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#142c4a"/>
      <stop offset="55%" stop-color="#0f2540"/>
      <stop offset="100%" stop-color="#0a1a30"/>
    </linearGradient>
    <radialGradient id="ic-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FB6E8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#155FBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ic-hub" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="28%" stop-color="#7dd3fc"/>
      <stop offset="62%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#155FBF"/>
    </radialGradient>
  </defs>
  <!-- full-bleed navy background (maskable-safe) -->
  <rect width="512" height="512" rx="112" fill="url(#ic-bg)"/>
  <!-- ambient glow behind dial -->
  <circle cx="256" cy="256" r="150" fill="url(#ic-glow)"/>
  <!-- dial face -->
  <circle cx="256" cy="256" r="118" fill="#1b2740"/>
  <circle cx="256" cy="256" r="118" fill="none" stroke="#41506b" stroke-width="6"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="#33425c" stroke-width="3"/>
  <!-- spokes -->
  <g stroke="#8fa0bd" stroke-width="13" stroke-linecap="round">
    <line x1="256" y1="150" x2="256" y2="192"/>
    <line x1="256" y1="362" x2="256" y2="320"/>
    <line x1="150" y1="256" x2="192" y2="256"/>
    <line x1="362" y1="256" x2="320" y2="256"/>
  </g>
  <g stroke="#6b7d9c" stroke-width="10" stroke-linecap="round">
    <line x1="181" y1="181" x2="208" y2="208"/>
    <line x1="331" y1="181" x2="304" y2="208"/>
    <line x1="181" y1="331" x2="208" y2="304"/>
    <line x1="331" y1="331" x2="304" y2="304"/>
  </g>
  <!-- glowing cyan hub -->
  <circle cx="256" cy="256" r="62" fill="url(#ic-glow)"/>
  <circle cx="256" cy="256" r="40" fill="#0a0e1a" stroke="#0ea5e9" stroke-width="5"/>
  <circle cx="256" cy="256" r="29" fill="url(#ic-hub)"/>
  <circle cx="244" cy="244" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
